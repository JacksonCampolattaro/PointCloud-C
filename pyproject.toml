[project]
name = "pointcloud-c"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "enum34>=1.1.10",
    "etw-pytorch-utils",
    "gdown>=5.2.0",
    "h5py>=3.15.1",
    "pointnet2",
    "progressbar2>=4.5.0",
    "scikit-learn>=1.7.2",
    "tensorboardx>=2.6.4",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "yacs>=0.1.8",
]

[tool.uv.sources]
pointnet2 = { path = "zoo/SimpleView/pointnet2_pyt", editable = true }
etw-pytorch-utils = { git = "https://github.com/JacksonCampolattaro/etw_pytorch_utils.git", rev = "eae82" }
